<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Dropshipping Gem</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><small>CREATIVE OPERATIONS</small><h1>AI Dropshipping Gem</h1></div><span id="health">接続中</span></header>
<main><section class="panel"><h2>素材アカウント登録</h2><form id="source"><input name="source_url" type="url" placeholder="Instagram / TikTok アカウントURL" required><button>登録して収集キューへ</button></form><p class="hint">自社保有・許諾済み・利用可能な素材のみ登録してください。</p></section>
<section class="stats"><article><b id="pending">—</b><span>承認待ち</span></article><article><b id="published">—</b><span>投稿済み</span></article><article><b id="accounts">—</b><span>アカウント</span></article></section>
<div class="queue-title"><h2>Approval Queue</h2><button class="ghost" onclick="load()">更新</button></div><section id="queue" class="queue"><div class="empty">候補を読み込んでいます</div></section></main>
<template id="card"><article class="card"><video controls playsinline></video><div class="meta"><span class="platform"></span><h3></h3><p class="caption"></p><div class="actions"><button data-a="reject" class="danger">却下</button><button data-a="regenerate" class="ghost">再生成</button><button data-a="approve">承認</button><button data-a="publish" class="publish">投稿</button></div></div></article></template><div id="toast"></div><script src="/app.js"></script></body></html>
