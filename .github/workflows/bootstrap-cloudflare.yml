name: Bootstrap Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-cloudflare.yml"
      - "actors/renderer/**"
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
permissions:
  contents: read
concurrency:
  group: production-bootstrap
  cancel-in-progress: true
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2932c698c449f57fde1f4929f8cf7769
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify Apify connection
        run: |
          test -n "$APIFY_API_TOKEN"
          curl -fsS -H "Authorization: Bearer $APIFY_API_TOKEN" https://api.apify.com/v2/users/me | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.data?.id)process.exit(1);console.log("APIFY_CONNECTION_OK")})'
      - name: Provision and build private video renderer
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.apify.com/v2"
          auth=(-H "Authorization: Bearer $APIFY_API_TOKEN" -H "Content-Type: application/json")
          actors="$(curl -fsS "${auth[@]}" "$api/acts?limit=100")"
          actor_id="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write((x.data?.items||[]).find(v=>v.name==="ai-dropshipping-gem-renderer")?.id||"")' "$actors")"
          version='{"versionNumber":"0.1","sourceType":"GIT_REPO","gitRepoUrl":"https://github.com/lead-forms/ai-dropshipping-gem.git#main:actors/renderer","buildTag":"latest"}'
          if [ -z "$actor_id" ]; then
            payload="$(node -e 'process.stdout.write(JSON.stringify({name:"ai-dropshipping-gem-renderer",title:"AI Dropshipping Gem Renderer",description:"Private FFmpeg scene analysis and vertical creative rendering",isPublic:false,versions:[JSON.parse(process.argv[1])]}))' "$version")"
            created="$(curl -fsS "${auth[@]}" -d "$payload" "$api/acts")"
            actor_id="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.data.id)' "$created")"
          else
            if curl -fsS "${auth[@]}" "$api/acts/$actor_id/versions/0.1" >/dev/null; then
              curl -fsS "${auth[@]}" -d "$version" "$api/acts/$actor_id/versions/0.1" >/dev/null
            else
              curl -fsS "${auth[@]}" -d "$version" "$api/acts/$actor_id/versions" >/dev/null
            fi
          fi
          build="$(curl -fsS "${auth[@]}" -X POST "$api/acts/$actor_id/builds?version=0.1&tag=latest&waitForFinish=60")"
          build_id="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.data.id)' "$build")"
          status="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.data.status)' "$build")"
          for _ in $(seq 1 30); do
            [ "$status" = "SUCCEEDED" ] && break
            case "$status" in FAILED|ABORTED|TIMED-OUT) curl -fsS "${auth[@]}" "$api/actor-builds/$build_id/log" || true; echo "ACTOR_BUILD_$status"; exit 1;; esac
            sleep 10
            build="$(curl -fsS "${auth[@]}" "$api/actor-builds/$build_id")"
            status="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.data.status)' "$build")"
          done
          [ "$status" = "SUCCEEDED" ]
          echo "RENDERER_ACTOR_ID=$actor_id" >> "$GITHUB_ENV"
          echo "APIFY_RENDERER_BUILD_OK"
      - name: Resolve account and provision resources
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          export ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          verify="$(curl -sS "${auth[@]}" "$api/user/tokens/verify")"
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.success){console.error("TOKEN_VERIFY_FAILED",JSON.stringify(x.errors));process.exit(1)};console.log("TOKEN_VERIFY_OK")' "$verify"
          d1s="$(curl -sS "${auth[@]}" "$api/accounts/$ACCOUNT_ID/d1/database?name=ai-dropshipping-gem")"
          export D1_ID="$(node -e 'const x=JSON.parse(process.argv[1]);if(!x.success)process.exit(1);process.stdout.write((x.result||[]).find(v=>v.name==="ai-dropshipping-gem")?.uuid||"")' "$d1s")"
          if [ -z "$D1_ID" ]; then
            created="$(curl -sS "${auth[@]}" -d '{"name":"ai-dropshipping-gem","primary_location_hint":"apac"}' "$api/accounts/$ACCOUNT_ID/d1/database")"
            export D1_ID="$(node -e 'const x=JSON.parse(process.argv[1]);if(!x.success)process.exit(1);process.stdout.write(x.result.uuid)' "$created")"
          fi
          buckets="$(curl -sS "${auth[@]}" "$api/accounts/$ACCOUNT_ID/r2/buckets")"
          if ! node -e 'const x=JSON.parse(process.argv[1]);process.exit((x.result?.buckets||x.result||[]).some(v=>v.name==="ai-dropshipping-gem-media")?0:1)' "$buckets"; then
            curl -fsS "${auth[@]}" -d '{"name":"ai-dropshipping-gem-media","locationHint":"apac"}' "$api/accounts/$ACCOUNT_ID/r2/buckets" >/dev/null
          fi
          queues="$(curl -fsS "${auth[@]}" "$api/accounts/$ACCOUNT_ID/queues")"
          for q in ai-dropshipping-gem-jobs ai-dropshipping-gem-dlq; do
            if ! QUEUE="$q" node -e 'const x=JSON.parse(process.argv[1]);process.exit((x.result||[]).some(v=>v.queue_name===process.env.QUEUE)?0:1)' "$queues"; then
              curl -fsS "${auth[@]}" -d "{\"queue_name\":\"$q\"}" "$api/accounts/$ACCOUNT_ID/queues" >/dev/null
            fi
          done
          node -e 'const fs=require("fs");const p="wrangler.jsonc";const x=JSON.parse(fs.readFileSync(p));x.d1_databases[0].database_id=process.env.D1_ID;fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n")'
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply ai-dropshipping-gem --remote
      - name: Generate and seed production E2E creative
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm run e2e
          npx wrangler r2 object put ai-dropshipping-gem-media/creatives/e2e-demo.mp4 --file e2e-result.mp4
          npx wrangler r2 object put ai-dropshipping-gem-media/sources/e2e/source1.mp4 --file e2e-source1.mp4
          npx wrangler r2 object put ai-dropshipping-gem-media/sources/e2e/source2.mp4 --file e2e-source2.mp4
          npx wrangler d1 execute ai-dropshipping-gem --remote --file scripts/seed-e2e.sql
          npx wrangler d1 execute ai-dropshipping-gem --remote --file scripts/seed-actor-e2e.sql
      - name: Deploy Worker and install provider secret
        run: |
          npx wrangler deploy
          printf '%s' "$APIFY_API_TOKEN" | npx wrangler secret put APIFY_API_TOKEN
          printf '%s' "$RENDERER_ACTOR_ID" | npx wrangler secret put APIFY_RENDERER_ACTOR_ID
      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          name="$(node -e 'const x=JSON.parse(process.argv[1]);if(!x.success)process.exit(1);process.stdout.write(x.result.subdomain)' "$subdomain")"
          url="https://ai-dropshipping-gem.$name.workers.dev"
          curl --retry 8 --retry-delay 3 --retry-all-errors -fsS "$url/api/health" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok)process.exit(1);console.log("PRODUCTION_HEALTH_OK",x.app)})'
          passcode="$(node -e 'const c=require("crypto");process.stdout.write(c.createHash("sha256").update(`gem:${process.env.APIFY_API_TOKEN}`).digest("hex").slice(0,24))')"
          curl -fsS -c cookies.txt -H 'content-type: application/json' -d "{\"passcode\":\"$passcode\"}" "$url/api/session" >/dev/null
          curl -fsS -b cookies.txt "$url/api/creatives?status=pending_approval" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.some(v=>v.id==="creative_e2e"&&v.media_key))process.exit(1);console.log("PRODUCTION_E2E_OK creative_e2e")})'
          internal_token="$(node -e 'const c=require("crypto");process.stdout.write(c.createHash("sha256").update(`internal:${process.env.APIFY_API_TOKEN}`).digest("hex").slice(0,48))')"
          for n in 1 2; do
            export SOURCE_N="$n" CALLBACK_TOKEN="$internal_token" APP_URL="$url"
            payload="$(node -e 'process.stdout.write(JSON.stringify({mode:"analyze",sourcePostId:`src_actor_e2e_${process.env.SOURCE_N}`,videoUrl:`${process.env.APP_URL}/api/internal/media/sources%2Fe2e%2Fsource${process.env.SOURCE_N}.mp4?token=${process.env.CALLBACK_TOKEN}`,callbackUrl:`${process.env.APP_URL}/api/internal/analyze-complete`,callbackToken:process.env.CALLBACK_TOKEN}))')"
            curl -fsS -H "Authorization: Bearer $APIFY_API_TOKEN" -H 'content-type: application/json' -d "$payload" "https://api.apify.com/v2/acts/$RENDERER_ACTOR_ID/run-sync?timeout=300&memory=1024" >/dev/null
          done
          actor_e2e_ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -b cookies.txt "$url/api/creatives?status=pending_approval" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.exit(x.some(v=>v.account_id==="acct_actor_e2e"&&v.media_key&&JSON.parse(v.qa_json||"{}").width===1080)?0:1)})'; then actor_e2e_ok=1; break; fi
            sleep 10
          done
          [ "$actor_e2e_ok" = 1 ]
          echo "APIFY_RENDER_PIPELINE_E2E_OK"
          echo "Production URL: $url"
